<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · PuntoComún</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="index.html">PuntoComún</a>
    <nav aria-label="Principal"><a href="index.html">Reportes</a><a href="ingreso.html">Ingresar</a></nav>
  </header>
  <main>
    <div class="tarjeta" style="max-width:480px">
      <h1>Crear cuenta</h1>
      <form id="form" novalidate>
        <div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" autocomplete="name" required></div>
        <div class="campo"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="ayuda" required>
          <span id="ayuda" class="suave">Mínimo 8 caracteres, con al menos una letra y un número.</span>
        </div>
        <p id="mensaje" class="mensaje" role="alert"></p>
        <button type="submit">Crear cuenta</button>
        <p class="suave">¿Ya tienes cuenta? <a href="ingreso.html">Ingresa</a></p>
      </form>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
